services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    # Postgres is *not* exposed to the host. Only the api can reach it.

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # No ports exposed: only reachable from the api on the docker network.
    # Pull model after first compose up:
    #   docker compose -f deploy/compose.prod.yml exec ollama ollama pull llama3.2:1b
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rag-docs:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      LLM_TIMEOUT_S: "300"
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
    volumes:
      - models:/models
    deploy:
      resources:
        limits:
          memory: 1G
    # The api binds to 8000 inside the network; Caddy reverse-proxies to it.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      INGEST_BASIC_AUTH: ${INGEST_BASIC_AUTH}

volumes:
  pgdata:
  ollama:
  models:
  caddy_data:
  caddy_config:
